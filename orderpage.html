<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurrCoffee - Cart</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link href="/src/style.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6F4E37;
      --dark-brown: #3E2723;
      --cream: #FFF8E7;
      --caramel: #C68E17;
      --white: #FFFFFF;
      --light-beige: #F5E6D3;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
    }

    .cart-container {
      max-width: 520px;
      width: 100%;
      background: var(--white);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(62, 39, 35, 0.12);
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
    }

    .cart-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--caramel), var(--primary), var(--caramel));
    }

    .decor-dots {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 6px);
      gap: 5px;
      opacity: 0.15;
    }

    .decor-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
    }

    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid var(--light-beige);
    }

    .cart-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--dark-brown);
      letter-spacing: -0.5px;
    }

    .cart-title .badge {
      display: inline-block;
      background: var(--light-beige);
      color: var(--primary);
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .cart-coffee-icon {
      width: 44px;
      height: 44px;
      background: var(--light-beige);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .order-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }

    .order-tab {
      padding: 0.7rem 0.5rem;
      border-radius: 14px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: default;
      background: var(--light-beige);
      color: var(--primary);
    }

    .order-tab.active {
      background: var(--primary);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(111, 78, 55, 0.3);
    }

    .cart-items {
      margin-bottom: 1.5rem;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px dashed var(--light-beige);
    }

    .cart-item:last-of-type {
      border-bottom: none;
    }

    .cart-item-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .cart-item-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      object-fit: cover;
      border: 2px solid var(--light-beige);
    }

    .cart-item-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--dark-brown);
    }

    .cart-item-price {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 500;
    }

    .cart-qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--light-beige);
      border-radius: 999px;
      padding: 0.3rem 0.6rem;
    }

    .cart-qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--primary);
    }

    .cart-qty-value {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--dark-brown);
      min-width: 18px;
      text-align: center;
    }

    .cart-summary {
      border-top: 2px solid var(--light-beige);
      padding-top: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
    }

    .summary-label {
      font-size: 0.9rem;
      color: #8a7266;
      font-weight: 400;
    }

    .summary-value {
      font-weight: 600;
      color: var(--dark-brown);
      font-size: 0.95rem;
    }

    .summary-divider {
      height: 1px;
      background: var(--light-beige);
      margin: 0.6rem 0;
    }

    .summary-row.total {
      padding: 0.6rem 0 0.2rem;
    }

    .summary-row.total .summary-label {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dark-brown);
    }

    .summary-row.total .summary-value {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--caramel);
    }

    .discount-amount {
      color: #2e7d32;
      font-weight: 600;
    }

    .place-order-btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 999px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--white);
      background: linear-gradient(135deg, var(--primary), var(--dark-brown));
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(111, 78, 55, 0.35);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .place-order-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(111, 78, 55, 0.45);
    }
  </style>
</head>
<body>

  <div class="cart-container">
    <div class="decor-dots">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>

    <!-- Header -->
    <div class="cart-header">
      <h1 class="cart-title">Cart <span class="badge">3</span></h1>
      <div class="cart-coffee-icon">☕</div>
    </div>

    <!-- Order Type Tabs -->
    <div class="order-tabs">
      <button class="order-tab active">🚚 Delivery</button>
      <button class="order-tab">🍽️ Dine in</button>
      <button class="order-tab">🥡 Take away</button>
    </div>

    <!-- Cart Items -->
    <div class="cart-items">

      <!-- Item 1 -->
      <div class="cart-item">
        <div class="cart-item-left">
          <img class="cart-item-img" src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=800&auto=format&fit=crop" alt="Cappuccino"/>
          <div>
            <div class="cart-item-name">Cappuccino</div>
            <div class="cart-item-price">$1.50</div>
          </div>
        </div>
        <div class="cart-qty-controls">
          <span class="cart-qty-btn">−</span>
          <span class="cart-qty-value">2</span>
          <span class="cart-qty-btn">+</span>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="cart-item">
        <div class="cart-item-left">
          <img class="cart-item-img" src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?q=80&w=800&auto=format&fit=crop" alt="Coffee Latte"/>
          <div>
            <div class="cart-item-name">Coffee Latte</div>
            <div class="cart-item-price">$1.60</div>
          </div>
        </div>
        <div class="cart-qty-controls">
          <span class="cart-qty-btn">−</span>
          <span class="cart-qty-value">1</span>
          <span class="cart-qty-btn">+</span>
        </div>
      </div>

    </div>

    <!-- Summary -->
    <div class="cart-summary">
      <div class="summary-row">
        <span class="summary-label">Subtotal</span>
        <span class="summary-value">$4.60</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Discount (20%)</span>
        <span class="summary-value discount-amount">-$0.92</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row total">
        <span class="summary-label">Grand Total</span>
        <span class="summary-value">$3.68</span>
      </div>
    </div>

    <!-- Place Order Button -->
    <button class="place-order-btn">
      <span>Place an Order</span>
      <span>→</span>
    </button>
  </div>

</body>
</html>
