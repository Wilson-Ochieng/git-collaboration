name: Coffee Shop CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build --if-present

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: npm ci
    
    - name: Deploy to Vercel
      id: deploy
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        echo " Deploying to Vercel..."
        DEPLOY_OUTPUT=$(npx vercel@latest --prod --yes 2>&1)
        echo "$DEPLOY_OUTPUT"
        
        # Extract URL from output
        URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+' | grep -E '\.vercel\.app|\.app' | head -1)
        
        if [ -n "$URL" ]; then
          echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT
        else
          # Default to project name
          echo "DEPLOY_URL=https://cicd.vercel.app" >> $GITHUB_OUTPUT
        fi
    
    - name: Show Deployment URL
      run: |
        echo " Deployment Successful!"
        echo " Live URL: ${{ steps.deploy.outputs.DEPLOY_URL }}"
        echo ""
        echo "You can access your application at:"
        echo "${{ steps.deploy.outputs.DEPLOY_URL }}"